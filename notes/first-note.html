<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>从这里开始：我的个人网站 · 梁奕宸</title><link rel="stylesheet" href="../assets/style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232548de'/%3E%3Ctext x='18' y='46' font-size='42' font-family='sans-serif' fill='white'%3EL%3C/text%3E%3C/svg%3E"></head><body><a class="skip" href="#main">跳到正文</a><header><a class="brand" href="../">梁<span> / 梁奕宸</span></a><nav aria-label="主导航"><a href="../#notes">返回学习笔记</a></nav></header><main id="main" class="note"><p class="eyebrow">LEARNING / 建站笔记</p><h1>从这里开始：我的个人网站</h1><p>这个网站用来放简历、整理学习内容，也记录之后完成的项目。</p><h2>先给内容一个位置</h2><p>简历呈现个人经历，学习笔记记录理解过程，项目展示把学过的内容变成实践。内容会随着学习逐步补充。</p><h2>让每篇笔记回答一个问题</h2><p>一篇笔记不必很长。可以从一个具体问题开始，写下尝试过的方法、关键结论，以及还没有弄明白的地方。</p><h2>保留每次修改</h2><p>网站文件用 Git 管理。每次更新先在本地检查，再提交并推送到 GitHub，由 GitHub Pages 发布。</p><p><a class="text-link" href="../#notes">回到学习笔记</a></p></main><footer><span>© 梁奕宸</span><a href="https://github.com/lllyyyccc357">GitHub</a></footer></body></html>
